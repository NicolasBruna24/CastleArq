[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "castlearq"
version = "0.5.1"
description = "Check whether a local GGUF model can run on your llama.cpp runtime, see the evidence, and refuse to run what it cannot justify."
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Nicolás Bruna", email = "brunafuentealba@gmail.com" }]

# B9.54: the PyPI page is the first surface a prospective user reads. It
# previously carried only the internal phrase "Local AI Runtime Architecture"
# and no body at all, so a visitor could not learn what they had installed.
# The long description is the repository README itself -- one source of truth,
# never a second copy that can drift.
readme = { file = "README.md", content-type = "text/markdown" }

# B9.53 section 13: every classifier below states something the repository can
# actually evidence. Development Status is Alpha, not Beta: a 0.x series with a
# single maintainer and no external users or contributions. Operating System is
# Linux because that is the only baseline exercised. No Documentation or Bug
# Tracker URL is declared, because none exists.
#
# No License classifier is listed: PEP 639 supersedes license classifiers with
# the SPDX ``license`` expression above, and setuptools rejects the combination.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# B9.57: continuous validation runs the suite from an explicitly declared
# validator, not from whatever happens to be installed on a maintainer's
# machine. B9.55 recorded that the only execution evidence CastleArq had was a
# local run on an undeclared environment; B9.56 ratified that pytest become a
# declared development dependency so a third party can reproduce the validation.
#
# This is a *development* extra only. CastleArq's runtime remains standard
# library only (see requirements.txt); nothing here changes what `pip install
# castlearq` pulls in, and no lint, coverage or test plugin is declared.
#
# The pin is exact on purpose: a validation contract whose validator floats is
# not reproducible. pytest 9.1.1 declares requires-python >=3.10, so this single
# pin covers the whole declared support matrix.
[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

# Bounded SFT + LoRA prototype extra. The runtime stays standard library
# only: these packages are imported lazily inside
# ``castlearq.training_runner`` and never at CastleArq import time, so
# ordinary commands work without them. Floor pins (not exact pins) are
# deliberate: the validated experiment used torch 2.14.1+xpu /
# transformers 5.19.0 / peft 0.21.2 / trl 1.15.0 / datasets 5.1.0 on
# Python 3.14, but those exact builds are accelerator- and
# platform-specific and must not be forced on every installer. The floors
# below are the minimum APIs the runner relies on (SFTConfig,
# processing_class, LoraConfig, HfDataset.from_dict); newer versions are
# accepted but unverified. CPU-only installs work; CUDA/XPU wheels are a
# caller-side choice, not something this extra selects.
training = [
    "torch>=2.5",
    "transformers>=4.48",
    "peft>=0.14",
    "trl>=0.14",
    "datasets>=3.0",
]

[project.urls]
Homepage = "https://www.nicobrunaf.dev/projects/castlearq/"
Repository = "https://github.com/NicolasBruna24/CastleArq"

[project.scripts]
castlearq = "castlearq.main:main"

[tool.setuptools.packages.find]
include = ["castlearq*"]
exclude = ["config*"]

[tool.pytest.ini_options]
pythonpath = ["."]
