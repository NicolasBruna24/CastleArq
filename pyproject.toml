[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "castlearq"
version = "0.1.0"
description = "CastleArq — Local AI Runtime Architecture"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Nicolás Bruna", email = "brunafuentealba@gmail.com" }]

[project.urls]
Homepage = "https://www.nicobrunaf.dev/projects/castlearq/"
Repository = "https://github.com/NicolasBruna24/CastleArq"

[project.scripts]
castlearq = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["config*"]

[tool.pytest.ini_options]
pythonpath = ["."]
