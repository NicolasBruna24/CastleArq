name: release

# CastleArq publishes to PyPI through Trusted Publishing (OIDC).
#
# Provenance model: A (decided in B9.41).
# This workflow NEVER rebuilds the distribution. The 0.1 build is not
# byte-reproducible, so a rebuild in CI would produce artifacts equivalent
# in content but different in bytes from the ones audited in B9.36. Instead,
# the exact audited artifacts attached to the GitHub Release are transported,
# verified against the SHA-256 values recorded in the release manifest
# committed at the tag, and published unmodified.
#
# Chain:
#   annotated tag -> GitHub Release assets -> SHA-256 gate -> PyPI
#
# The PyPI Pending Publisher is registered as:
#   project castlearq / GitHub / NicolasBruna24 / CastleArq
#   workflow release.yml / environment pypi
# The filename of this file and the `pypi` environment name are part of the
# release contract: renaming either silently breaks the publisher.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# Deny by default. `id-token: write` is granted only to the publish job.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.identify.outputs.version }}
    steps:
      - name: Identify release tag
        id: identify
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to process non-semver tag: $TAG" >&2
            exit 1
          fi
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG (version $version)"

      - name: Check out the tagged release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Assert the tag is annotated and resolve it
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          type=$(git cat-file -t "refs/tags/$TAG")
          if [ "$type" != "tag" ]; then
            echo "Tag $TAG is a $type, expected an annotated tag." >&2
            exit 1
          fi
          echo "Annotated tag $TAG resolves to $(git rev-parse "refs/tags/$TAG^{commit}")"

      - name: Read expected SHA-256 from the release manifest
        env:
          VERSION: ${{ steps.identify.outputs.version }}
        run: |
          set -euo pipefail
          manifest="docs/release/v${VERSION}-manifest.md"
          if [ ! -f "$manifest" ]; then
            echo "Release manifest not found: $manifest" >&2
            exit 1
          fi
          echo "Reading expected hashes from $manifest"
          python3 - "$manifest" "$VERSION" > expected.sha256 <<'PY'
          import re
          import sys

          path, version = sys.argv[1], sys.argv[2]
          text = open(path, encoding="utf-8").read()

          wheel = f"castlearq-{version}-py3-none-any.whl"
          sdist = f"castlearq-{version}.tar.gz"
          for name in (wheel, sdist):
              pattern = re.compile(
                  re.escape(name) + r".{0,200}?SHA-256:\s*([0-9a-fA-F]{64})",
                  re.DOTALL,
              )
              match = pattern.search(text)
              if not match:
                  sys.exit(f"no SHA-256 recorded for {name} in {path}")
              print(f"{match.group(1).lower()}  dist/{name}")
          PY
          cat expected.sha256

      - name: Download the audited artifacts from the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.identify.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          wheel="castlearq-${VERSION}-py3-none-any.whl"
          sdist="castlearq-${VERSION}.tar.gz"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$wheel" --pattern "$sdist" \
            --dir dist
          for f in "$wheel" "$sdist"; do
            if [ ! -f "dist/$f" ]; then
              echo "Release $TAG is missing asset $f" >&2
              exit 1
            fi
          done
          ls -l dist

      - name: Verify SHA-256 against the manifest (fail closed)
        run: |
          set -euo pipefail
          echo "Expected:"; cat expected.sha256
          echo "Actual:";  (cd dist && sha256sum *.whl *.tar.gz)
          if ! sha256sum --check expected.sha256 --strict; then
            echo "SHA-256 MISMATCH — refusing to continue to publication." >&2
            exit 1
          fi
          echo "All artifact hashes match the release manifest."

      - name: Hand the verified artifacts to the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    # Must match the Pending Publisher registered on PyPI exactly.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-distributions
          path: dist/

      # No credential, token or password is configured anywhere. The OIDC
      # exchange below mints a short-lived PyPI token scoped to this run.
      # PyPI is append-only: an upload of an existing version fails, and the
      # workflow performs no delete, replace or retry-on-version logic.
      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
