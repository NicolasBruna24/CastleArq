name: release

# CastleArq publishes to PyPI through Trusted Publishing (OIDC).
#
# Provenance model: A (decided in B9.41).
# This workflow NEVER rebuilds the distribution. The 0.1 build is not
# byte-reproducible, so a rebuild in CI would produce artifacts equivalent
# in content but different in bytes from the ones audited in B9.36. Instead,
# the exact audited artifacts attached to the GitHub Release are transported,
# verified against the SHA-256 values recorded in the release manifest
# committed at the tag, and published unmodified.
#
# Chain:
#   trigger (tag push | manual dispatch) -> annotated tag -> manifest committed
#   at the tag -> GitHub Release assets -> SHA-256 gate -> PyPI
#
# Both triggers funnel into the same `verify` job, which re-derives the release
# identity from the tag. The dispatch input is a selector, not an authority, so
# there is no `arbitrary ref -> publish` path.
#
# The PyPI Pending Publisher is registered as:
#   project castlearq / GitHub / NicolasBruna24 / CastleArq
#   workflow release.yml / environment pypi
# The filename of this file and the `pypi` environment name are part of the
# release contract: renaming either silently breaks the publisher.

on:
  # Primer despliegue de v0.6.2: exclusivamente workflow_dispatch desde main.
  # No se usa `push: tags` para evitar que un push de tag active accidentalmente
  # este workflow durante el bootstrap. El checkout explícito del tag se hace
  # dentro del job `verify`.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing annotated semver tag to publish, e.g. v0.6.2'
        required: true
        type: string

# Deny by default. `id-token: write` is granted only to the publish job.
permissions:
  contents: read

concurrency:
  # Keyed on the release TAG, not on github.ref: a dispatch run is launched
  # from a branch, so a ref-keyed group would not serialise a dispatch against
  # the tag push of the same release. One release => one concurrency group.
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.identify.outputs.version }}
      tag: ${{ steps.identify.outputs.tag }}
    steps:
      - name: Identify release tag
        id: identify
        env:
          # A dispatch run carries the operator input; a tag push carries the
          # pushed tag. Both are re-validated here against the semver shape and
          # then re-derived from the repository itself.
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
            # The tag must be an explicit full ref name, never a branch-like or
            # path-like selector.
            if [ "$TAG" != "${TAG#refs/}" ]; then
              echo "Refusing to process a non tag name: $TAG" >&2
              exit 1
            fi
          else
            TAG="$REF_NAME"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to process non-semver tag: $TAG" >&2
            exit 1
          fi
          version="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG (version $version), event: $EVENT_NAME"

      - name: Check out the tagged release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always the TAG, never the dispatch branch: the manifest and the
          # audited artifacts must come from the tagged tree.
          ref: refs/tags/${{ steps.identify.outputs.tag }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify version consistency
        run: |
          set -euo pipefail
          TAG_VERSION=${{ steps.identify.outputs.version }}
          PYPI_VERSION=$(grep -E '^version = ' pyproject.toml | sed -E 's/^version = "([^"]+)".*/\1/')
          if [ "$PYPI_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: pyproject.toml=$PYPI_VERSION, tag=$TAG_VERSION"
            exit 1
          fi
          echo "Versions match: $TAG_VERSION"

      - name: Assert the tag is annotated and resolve it
        id: resolve-tag
        env:
          TAG: ${{ steps.identify.outputs.tag }}
        run: |
          set -euo pipefail
          type=$(git cat-file -t "refs/tags/$TAG")
          if [ "$type" != "tag" ]; then
            echo "Tag $TAG is a $type, expected an annotated tag." >&2
            exit 1
          fi
          COMMIT=$(git rev-parse "refs/tags/$TAG^{commit}")
          echo "Annotated tag $TAG resolves to $COMMIT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Assert the GitHub Release matches the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.identify.outputs.tag }}
        run: |
          set -euo pipefail
          # The release must exist, be published (not a draft), and its tag must
          # be exactly $TAG. gh release download in the next step therefore only
          # ever reaches assets of the audited release.
          json=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          draft=$(jq -r '.draft' <<<"$json")
          target=$(jq -r '.tag_name' <<<"$json")
          if [ "$draft" != "false" ]; then
            echo "Release $TAG is still a draft; refusing to publish." >&2
            exit 1
          fi
          if [ "$target" != "$TAG" ]; then
            echo "Release tag_name '$target' does not match requested tag '$TAG'." >&2
            exit 1
          fi
          echo "GitHub Release $TAG is published and bound to tag $target."

      - name: Download the release manifest asset from GitHub Release
        if: ${{ steps.identify.outputs.tag != 'v0.6.1' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.identify.outputs.tag }}
          VERSION: ${{ steps.identify.outputs.version }}
        run: |
          set -euo pipefail
          manifest_asset="v${VERSION}-manifest.md"
          mkdir -p manifest-source
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$manifest_asset" \
            --dir manifest-source
          if [ ! -f "manifest-source/$manifest_asset" ]; then
            echo "Release $TAG is missing manifest asset $manifest_asset" >&2
            exit 1
          fi
          echo "Release manifest asset downloaded: manifest-source/$manifest_asset"

      - name: Read and validate identity from downloaded release manifest
        if: ${{ steps.identify.outputs.tag != 'v0.6.1' }}
        env:
          VERSION: ${{ steps.identify.outputs.version }}
          TAG: ${{ steps.identify.outputs.tag }}
          COMMIT: ${{ steps.resolve-tag.outputs.commit }}
        run: |
          set -euo pipefail
          mkdir -p manifest
          manifest="manifest-source/v${VERSION}-manifest.md"
          python3 scripts/release_manifest.py parse-markdown \
            --manifest "$manifest" \
            --version "$VERSION" \
            --tag "$TAG" \
            --commit "$COMMIT" > manifest/SHA256SUMS
          cat manifest/SHA256SUMS
      - name: Download the audited artifacts from the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.identify.outputs.tag }}
          VERSION: ${{ steps.identify.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          wheel="castlearq-${VERSION}-py3-none-any.whl"
          sdist="castlearq-${VERSION}.tar.gz"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$wheel" --pattern "$sdist" \
            --dir dist
          for f in "$wheel" "$sdist"; do
            if [ ! -f "dist/$f" ]; then
              echo "Release $TAG is missing asset $f" >&2
              exit 1
            fi
          done
          ls -l dist

      - name: Verify pinned SHA-256 for v0.6.1 (fail closed)
        if: ${{ steps.identify.outputs.tag == 'v0.6.1' }}
        run: |
          set -euo pipefail
          expected_wheel="3bc785df311bac91b0781b829acf85ba79ffc95e3352ba227c1358d9537e7bb7"
          expected_sdist="d7a7710b94ca9e2430cbab01daabb37a8dbb40577857d1eff3ed8254f5ae05f5"
          for f in dist/castlearq-0.6.1-py3-none-any.whl dist/castlearq-0.6.1.tar.gz; do
            if [ ! -f "$f" ]; then
              echo "Missing artifact: $f" >&2
              exit 1
            fi
          done
          actual_wheel=$(sha256sum dist/castlearq-0.6.1-py3-none-any.whl | cut -d' ' -f1)
          actual_sdist=$(sha256sum dist/castlearq-0.6.1.tar.gz | cut -d' ' -f1)
          if [ "$actual_wheel" != "$expected_wheel" ]; then
            echo "Wheel SHA-256 mismatch" >&2
            exit 1
          fi
          if [ "$actual_sdist" != "$expected_sdist" ]; then
            echo "Sdist SHA-256 mismatch" >&2
            exit 1
          fi
          echo "Pinned SHA-256 verified for v0.6.1."

      - name: Verify SHA-256 against release manifest (fail closed)
        if: ${{ steps.identify.outputs.tag != 'v0.6.1' }}
        run: |
          set -euo pipefail
          echo "Expected:"; cat manifest/SHA256SUMS
          echo "Actual:";  (cd dist && sha256sum *.whl *.tar.gz)
          if ! (cd dist && sha256sum --check ../manifest/SHA256SUMS --strict); then
            echo "SHA-256 MISMATCH — refusing to continue to publication." >&2
            exit 1
          fi
          echo "All artifact hashes match the release manifest."

      - name: Generate release-manifest.json and SHA256SUMS
        env:
          VERSION: ${{ steps.identify.outputs.version }}
          TAG: ${{ steps.identify.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p manifest
          python3 scripts/release_manifest.py generate \
            --version "$VERSION" \
            --tag "$TAG" \
            --artifacts-dir dist \
            --manifest-out manifest/release-manifest.json \
            --sums-out manifest/SHA256SUMS

      - name: Validate release manifests
        run: |
          set -euo pipefail
          python3 scripts/release_manifest.py validate \
            --artifacts-dir dist \
            --sums-path manifest/SHA256SUMS
          echo "Release manifests are valid."

      - name: Hand the verified artifacts to the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-distributions
          path: |
            dist/
            manifest/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    # Must match the Pending Publisher registered on PyPI exactly.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      # Duplicate-publication guard, enforced by the workflow itself and not
      # delegated to PyPI's append-only behaviour: if this version is already
      # present in the index, the run aborts before any OIDC token is minted.
      # Combined with the tag-keyed concurrency group above, the same artifacts
      # can never be published twice from two triggers.
      - name: Check out the validated tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.verify.outputs.tag }}
          persist-credentials: false
          fetch-depth: 0

      - name: Check PyPI publication status
        id: pypi-status
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/castlearq/${VERSION}/json")
          if [ "$code" = "404" ]; then
            echo "castlearq ${VERSION} is not published yet."
            echo "pypi_status=not_published" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "200" ]; then
            echo "castlearq ${VERSION} is already on PyPI; will verify exact match."
            echo "pypi_status=published" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected PyPI response ($code); refusing to publish." >&2
            exit 1
          fi

      - name: Download the verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-distributions
          path: .

      - name: Verify distributions before publish
        run: |
          set -euo pipefail
          python3 scripts/release_manifest.py validate \
            --manifest manifest/release-manifest.json \
            --artifacts-dir dist \
            --sums-path manifest/SHA256SUMS
          echo "Distributions verified before publish."

      - name: Verify PyPI exact match (idempotency)
        id: verify_pypi_exact_match
        if: steps.pypi-status.outputs.pypi_status == 'published'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          script_dir = Path.cwd()
          sys.path.insert(0, str(script_dir / "scripts"))
          from release_manifest import check_pypi_status

          version = os.environ["VERSION"]
          sums_path = Path("manifest/SHA256SUMS")

          expected_files = {
              f"castlearq-{version}-py3-none-any.whl",
              f"castlearq-{version}.tar.gz",
          }

          # Check PyPI status using the shared function. It reads and validates
          # SHA256SUMS itself and never substitutes expected_files silently.
          result = check_pypi_status(version, expected_files, sums_path)

          def set_output(name, value):
              gh_output = os.environ.get("GITHUB_OUTPUT")
              if gh_output:
                  with open(gh_output, "a", encoding="utf-8") as fh:
                      fh.write(f"{name}={value}\n")

          if result["status"] == "already_published":
              set_output("idempotency", "already_published")
              print(
                  f"castlearq {version} already published on PyPI with exact match; "
                  f"skipping publication.",
                  file=sys.stderr,
              )
              sys.exit(0)
          elif result["status"] == "not_published":
              set_output("idempotency", "not_published")
              print("castlearq not yet published on PyPI (404); proceeding to publish.", file=sys.stderr)
              sys.exit(0)
          elif result["status"] == "needs_publish":
              # Version already on PyPI with different hashes/unexpected files -> ABORT
              print(f"castlearq {version} already published on PyPI with different configuration; aborting.", file=sys.stderr)
              sys.exit(1)
          else:
              # error status
              print(f"PyPI status check error: {result.get('error', 'unknown')}", file=sys.stderr)
              sys.exit(1)
          PY
      # Conditional: skip publish if already published with exact match
      - name: Skip publish if already published
        if: steps.verify_pypi_exact_match.outputs.idempotency == 'already_published'
        run: echo "castlearq already published on PyPI; skipping publication"
      # Conditional: proceed to publish if not yet published or no exact match
      - name: Proceed to PyPI publication
        if: steps.verify_pypi_exact_match.outputs.idempotency == 'not_published'
        run: echo "Publishing castlearq to PyPI"

      # No credential, token or password is configured anywhere. The OIDC
      # exchange below mints a short-lived PyPI token scoped to this run.
      # PyPI is append-only: an upload of an existing version fails, and the
      # workflow performs no delete, replace or retry-on-version logic.
      - name: Publish to PyPI via Trusted Publishing
        id: pypi-publish
        continue-on-error: true
        if: ${{ steps.pypi-status.outputs.pypi_status == 'not_published' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      - name: Reconcile PyPI publication if upload failed
        if: ${{ !cancelled() && steps.pypi-publish.outcome == 'failure' && steps.pypi-status.outputs.pypi_status == 'not_published' }}
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.request
          import urllib.error
          from pathlib import Path

          script_dir = Path.cwd()
          sys.path.insert(0, str(script_dir / "scripts"))
          from release_manifest import load_sha256_sums

          version = os.environ["VERSION"]
          url = f"https://pypi.org/pypi/castlearq/{version}/json"
          sums_path = Path("manifest/SHA256SUMS")

          expected, sums_error = load_sha256_sums(sums_path)
          if sums_error is not None:
              print(f"SHA256SUMS invalid: {sums_error}", file=sys.stderr)
              sys.exit(1)

          expected_files = {
              f"castlearq-{version}-py3-none-any.whl",
              f"castlearq-{version}.tar.gz",
          }

          if set(expected.keys()) != expected_files:
              print("SHA256SUMS does not contain exactly the two expected artifacts.", file=sys.stderr)
              sys.exit(1)

          # Query PyPI to check if upload succeeded despite the action failure.
          for attempt in range(5):
              try:
                  with urllib.request.urlopen(url) as resp:
                      data = json.loads(resp.read().decode())
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      print("Version not found on PyPI after upload failure.", file=sys.stderr)
                      sys.exit(1)
                  print(f"PyPI HTTP error {exc.code}; retrying.", file=sys.stderr)
                  time.sleep(3)
                  continue
              except Exception as exc:
                  print(f"PyPI query failed: {exc}; retrying.", file=sys.stderr)
                  time.sleep(3)
                  continue

              if not isinstance(data, dict) or not isinstance(data.get("urls"), list):
                  print("Invalid PyPI response structure.", file=sys.stderr)
                  sys.exit(1)

              published = {}
              seen = []
              structural_ok = True
              for entry in data["urls"]:
                  if not isinstance(entry, dict):
                      structural_ok = False
                      break
                  fname = entry.get("filename")
                  digests = entry.get("digests")
                  if not isinstance(fname, str) or fname == "" or not isinstance(digests, dict):
                      structural_ok = False
                      break
                  sha256 = digests.get("sha256")
                  if not isinstance(sha256, str):
                      structural_ok = False
                      break
                  if fname in seen:
                      structural_ok = False
                      break
                  seen.append(fname)
                  published[fname] = sha256.lower()

              if not structural_ok:
                  print("Invalid PyPI entry structure.", file=sys.stderr)
                  sys.exit(1)

              if set(published.keys()) != expected_files:
                  print("PyPI files do not match expected artifacts.", file=sys.stderr)
                  sys.exit(1)

              mismatches = []
              for f in expected_files:
                  if published.get(f) != expected.get(f):
                      mismatches.append(f"{f}: PyPI={published.get(f)}, expected={expected.get(f)}")
              if mismatches:
                  print("PyPI hashes do not match SHA256SUMS.", file=sys.stderr)
                  sys.exit(1)

              # Upload succeeded despite action failure; accept the race.
              print("castlearq already published on PyPI with exact match; accepting race.", file=sys.stderr)
              gh_output = os.environ.get("GITHUB_OUTPUT")
              if gh_output:
                  with open(gh_output, "a", encoding="utf-8") as fh:
                      fh.write("reconciled=true\n")
              sys.exit(0)

          print("PyPI query failed after retries.", file=sys.stderr)
          sys.exit(1)
          PY

      - name: Verify PyPI publication (post-publish, retries)
        if: ${{ steps.pypi-status.outputs.pypi_status == 'not_published' && (steps.pypi-publish.outcome == 'success' || steps.reconcile_pypi.outputs.reconciled == 'true') }}
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          import time
          import urllib.request
          import urllib.error
          import json
          from pathlib import Path

          script_dir = Path.cwd()
          sys.path.insert(0, str(script_dir / "scripts"))
          from release_manifest import (
              check_pypi_status,
              load_sha256_sums,
              verify_artifact_hashes,
          )

          version = os.environ["VERSION"]
          url = f"https://pypi.org/pypi/castlearq/{version}/json"
          sums_path = Path("manifest/SHA256SUMS")
          expected_files = {
              f"castlearq-{version}-py3-none-any.whl",
              f"castlearq-{version}.tar.gz",
          }

          # 1. Validar el manifiesto de sumas local con la validación compartida.
          #    No hay parsing de SHA256SUMS duplicado ni permisivo en este paso.
          expected, sums_error = load_sha256_sums(sums_path)
          if sums_error is not None:
              print(
                  f"SHA256SUMS inválido (error estructural del manifiesto): {sums_error}",
                  file=sys.stderr,
              )
              sys.exit(1)

          # 2. El manifiesto debe contener exactamente los dos artefactos esperados
          #    para la versión. Cualquier nombre inesperado o faltante es una
          #    discrepancia definitiva: abortar sin reintentar.
          if set(expected.keys()) != expected_files:
              print(
                  f"SHA256SUMS no contiene exactamente los dos artefactos esperados: "
                  f"esperado {sorted(expected_files)}, encontrado {sorted(expected.keys())}",
                  file=sys.stderr,
              )
              sys.exit(1)

          # 3. Ejecutar realmente verify_artifact_hashes() sobre cada artefacto
          #    local frente al hash de SHA256SUMS. Hash local incorrecto =>
          #    discrepancia definitiva: no se valida la publicación en PyPI.
          dist = Path("dist")
          for fname in sorted(expected_files):
              artifact = dist / fname
              if not artifact.is_file():
                  print(f"Artefacto local ausente: {artifact}", file=sys.stderr)
                  sys.exit(1)
              if not verify_artifact_hashes(artifact, expected[fname]):
                  print(f"Hash local incorrecto para {fname}: no coincide con SHA256SUMS", file=sys.stderr)
                  sys.exit(1)
          print("Artefactos locales verificados contra SHA256SUMS mediante verify_artifact_hashes().")

          # 4. Reconciliar con PyPI. Distingue:
          #    - ausencia temporal de publicación (HTTP 404): se reintenta.
          #    - errores de red transitorios: se reintentan.
          #    - errores estructurales de la respuesta de PyPI (estructura
          #      inválida): abortan sin reintentar.
          #    - discrepancias definitivas (archivos distintos o hash distinto):
          #      abortan sin reintentar.
          for attempt in range(10):
              try:
                  with urllib.request.urlopen(url) as resp:
                      data = json.loads(resp.read().decode())
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      # Ausencia temporal de publicación: todavía no está indexado.
                      print(f"Attempt {attempt + 1}: castlearq {version} not yet on PyPI (404); retrying.")
                  elif 500 <= exc.code < 600:
                      # Error de servidor PyPI: reintentar de forma acotada.
                      print(f"Attempt {attempt + 1}: PyPI HTTP error {exc.code}: {exc.reason}; retrying.")
                  else:
                      # 4xx distintos de 404: error permanente, abortar.
                      print(f"Attempt {attempt + 1}: PyPI HTTP error {exc.code}: {exc.reason}; aborting.", file=sys.stderr)
                      sys.exit(1)
                  time.sleep(5)
                  continue
              except Exception as exc:
                  # Errores de red transitorios: reintentar.
                  print(f"Attempt {attempt + 1}: PyPI query failed: {exc}; retrying.")
                  time.sleep(5)
                  continue

              # Errores estructurales de la respuesta: abortan (no son transitorios).
              if not isinstance(data.get("urls"), list):
                  print(
                      f"castlearq {version}: PyPI response has no 'urls' list (structural error).",
                      file=sys.stderr,
                  )
                  sys.exit(1)

              published = {}
              structural_error = False
              seen = []
              for entry in data["urls"]:
                  if not isinstance(entry, dict):
                      print(f"castlearq {version}: invalid PyPI URL entry (not dict).", file=sys.stderr)
                      structural_error = True
                      break
                  fname = entry.get("filename")
                  digests = entry.get("digests")
                  if not isinstance(fname, str) or not isinstance(digests, dict):
                      print(f"castlearq {version}: invalid PyPI entry structure.", file=sys.stderr)
                      structural_error = True
                      break
                  sha256 = digests.get("sha256")
                  if not isinstance(sha256, str):
                      print(
                          f"castlearq {version}: missing/invalid sha256 digest for {fname!r}.",
                          file=sys.stderr,
                      )
                      structural_error = True
                      break
                  if fname in seen:
                      print(
                          f"castlearq {version}: duplicate filename {fname!r} in PyPI response.",
                          file=sys.stderr,
                      )
                      structural_error = True
                      break
                  seen.append(fname)
                  published[fname] = sha256.lower()

              if structural_error:
                  sys.exit(1)

              # Discrepancia definitiva: los nombres publicados no coinciden exactamente.
              if set(published.keys()) != expected_files:
                  print(
                      f"castlearq {version}: PyPI files mismatch (definitive discrepancy): "
                      f"expected {sorted(expected_files)}, got {sorted(published.keys())}",
                      file=sys.stderr,
                  )
                  sys.exit(1)

              # Discrepancia definitiva: hash distinto para algún artefacto.
              mismatches = []
              for f in expected_files:
                  if published.get(f) != expected.get(f):
                      mismatches.append(f"{f}: PyPI={published.get(f)}, expected={expected.get(f)}")
              if mismatches:
                  print(
                      f"castlearq {version}: hash mismatch (definitive discrepancy): {'; '.join(mismatches)}",
                      file=sys.stderr,
                  )
                  sys.exit(1)

              # Todo coincide.
              print(f"castlearq {version} verified on PyPI after {attempt + 1} attempt(s).")
              sys.exit(0)

          print(f"castlearq {version} not verified on PyPI after retries.", file=sys.stderr)
          sys.exit(1)
          PY
